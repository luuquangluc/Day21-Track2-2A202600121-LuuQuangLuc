name: MLOps Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Thay doi region neu can

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          acc=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$acc" >> $GITHUB_OUTPUT

      - name: Upload model to S3
        run: |
          aws s3 cp models/model.pkl s3://${{ secrets.CLOUD_BUCKET }}/models/latest/model.pkl

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        run: |
          python -c "import sys; acc=float('${{ needs.train.outputs.accuracy }}'); print(f'Accuracy: {acc}'); sys.exit(0 if acc >= 0.65 else 1)"

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            PROJECT_DIR=~/Day21-Track2-2A202600121-LuuQuangLuc
            
            # 1. Clone hoac Update code
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            cd $PROJECT_DIR
            git pull origin master || echo "Already up to date"
            
            # 2. Cai dat pip va dependencies
            sudo apt-get update
            sudo apt-get install -y python3-pip
            pip3 install --upgrade pip
            pip3 install --upgrade pyOpenSSL cryptography urllib3
            pip3 install -r requirements.txt
            
            # 3. Tu dong tao file service
            sudo bash -c "cat > /etc/systemd/system/mlops-serve.service <<EOF
            [Unit]
            Description=MLOps Serving API
            After=network.target

            [Service]
            User=${{ secrets.VM_USER }}
            WorkingDirectory=$PROJECT_DIR
            Environment=CLOUD_BUCKET=${{ secrets.CLOUD_BUCKET }}
            ExecStart=/usr/bin/python3 -m uvicorn src.serve:app --host 0.0.0.0 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF"

            # 4. Reload va Restart service
            sudo systemctl daemon-reload
            sudo systemctl enable mlops-serve
            sudo systemctl restart mlops-serve
            
            # 5. Kiem tra suc khoe
            sleep 15
            if ! curl --fail http://localhost:8000/health; then
              echo "Deployment failed! Printing service logs:"
              sudo journalctl -u mlops-serve -n 50
              exit 1
            fi
